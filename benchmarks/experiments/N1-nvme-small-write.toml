# The NVMe ceiling for the hdd series: the same runs as H1-H3 with mars's end
# on its NVMe drive instead of the hard disk, to learn whether xs can pass
# 1 Gb/s on small and mixed files when the disk is not the limit. The
# hard-drive runs follow later and are read against these.
# N1: writing onto mars's NVMe, Mac to mars, xs against rsync, durable.
id = "N1-nvme-small-write"
kind = "screening"
hypothesis = "xs -a writes small and mixed trees onto NVMe faster than rsync -a, durably, and passes 1 Gb/s."
primary = "durable_s"
delta = 0.03
blocks = 8
control = "rsync"
verify = "first-last"
cleanup = "eager"

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[arms.xs]
tool = "xs"
rev = "8cc75bbdb801"
flags = ["-a"]

[matrix]
link = "mac-mars-direct"
corpus = ["tiny-one", "small-flat", "small-deep", "small-opaque", "mixed-bimodal", "mixed-threshold"]
scenario = ["fresh", "noop"]
direction = ["mac>mars"]
client = ["initiator"]
cache = ["warm"]
