# Z2b-10g-compress-tune: as Z2-10g-compress-tune without the congress slice, whose copies are bound by per-file
# work (0.15 to 0.56 Gb/s) and move to neo and freya.
# Z2: tuning xs -z at 10 Gb/s. More workers mean more compressors at once;
# larger blocks give each zstd frame more history (fewer bytes) at some cost
# to parallelism. Tunables build with metrics, so each sample records the
# compressed and raw bytes and each end's CPU.
id = "Z2b-10g-compress-tune"
kind = "screening"
hypothesis = "More workers or larger blocks make xs -z faster on compressible trees at 10 Gb/s."
primary = "durable_s"
delta = 0.03
blocks = 6
control = "z"
verify = "first-last"
cleanup = "eager"

[arms.z]
tool = "xs"
rev = "453704a64528-tune"
flags = ["-az"]
metrics = true

[arms.z-j16]
tool = "xs"
rev = "453704a64528-tune"
flags = ["-az", "-j16"]
metrics = true

[arms.z1-block4m]
tool = "xs"
rev = "453704a64528-tune"
flags = ["-az", "--compress-level=1"]
tune = "block_target=4194304"
metrics = true

[arms.z3-block16m]
tool = "xs"
rev = "453704a64528-tune"
flags = ["-az", "--compress-level=3"]
tune = "block_target=16777216,small_max=2097152"
metrics = true

[arms.z3-j16]
tool = "xs"
rev = "453704a64528-tune"
flags = ["-az", "--compress-level=3", "-j16"]
metrics = true

[matrix]
link = "mac-mars-direct"
corpus = ["large-text", "large-half"]
scenario = ["fresh"]
direction = ["mac>mars", "mars>mac"]
client = ["initiator"]
cache = ["warm"]
