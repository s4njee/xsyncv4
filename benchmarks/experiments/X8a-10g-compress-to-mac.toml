# X8a: compression at 10 Gb/s, mars to the Mac. One ssh connection carries about 8 Gb/s,
# so -z can only win where data compresses well. xs compresses each DATA block
# (up to 1 MiB, packing many small files) on its own and in parallel; rsync
# -z runs one zstd stream across the whole transfer, on one thread, which
# compresses better and slower. xs without -z, xs -z adaptive and at levels 3
# and 6, against rsync -z, on compressible small and mixed trees and an
# incompressible small one. Large files are settled (X5, X6) and left out.
id = "X8a-10g-compress-to-mac"
kind = "screening"
hypothesis = "At 10 Gb/s xs -z beats rsync -z on compressible trees and costs little on incompressible ones."
primary = "durable_s"
delta = 0.03
blocks = 6
control = "xs"
verify = "first-last"
cleanup = "eager"

[arms.xs]
tool = "xs"
rev = "8cc75bbdb801"
flags = ["-a"]

[arms.xs-z]
tool = "xs"
rev = "8cc75bbdb801"
flags = ["-az"]

[arms.xs-z3]
tool = "xs"
rev = "8cc75bbdb801"
flags = ["-az", "--compress-level=3"]

[arms.xs-z6]
tool = "xs"
rev = "8cc75bbdb801"
flags = ["-az", "--compress-level=6"]

[arms.rsync-z]
tool = "rsync"
flags = ["-az"]

[matrix]
link = "mac-mars-direct"
corpus = ["mixed-bimodal", "small-flat", "small-opaque"]
scenario = ["fresh"]
direction = ["mars>mac"]
client = ["initiator"]
cache = ["warm"]
