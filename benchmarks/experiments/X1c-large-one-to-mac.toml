# X1c: X1a's mars-to-Mac half again; in X1a the Mac ran out of disk (Time
# Machine snapshots kept each received copy), voiding 15 of 28 samples.
# Large files over the Mac-mars direct cable (about 3 Gb/s of TCP each
# way; ssh alone carries 1.0-1.7 Gb/s with ChaCha20 and 2.1-2.5 with
# AES-GCM). One 7.45 GiB file (a Windows ISO), both directions, fresh copies.
# The Mac starts every transfer; its ssh prefers AES-128-GCM, so the plain
# arms use that and the -chacha arms force ChaCha20. Fresh only: the Mac has room for one copy.
id = "X1c-large-one-to-mac"
kind = "screening"
hypothesis = "On a ~3 Gb/s direct link, xs -a copies large files at least as fast as rsync -a, and ChaCha20 slows both against AES-GCM."
primary = "durable_s"
delta = 0.03
blocks = 8
control = "rsync"
verify = "first-last"
cleanup = "eager"

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[arms.rsync-chacha]
tool = "rsync"
flags = ["-a"]
ssh_options = ["-c", "chacha20-poly1305@openssh.com"]

[arms.xs]
tool = "xs"
rev = "8cc75bbdb801"
flags = ["-a"]

[arms.xs-chacha]
tool = "xs"
rev = "8cc75bbdb801"
flags = ["-a"]
ssh_options = ["-c", "chacha20-poly1305@openssh.com"]

[matrix]
link = "mac-mars-direct"
corpus = ["large-one"]
scenario = ["fresh"]
direction = ["mars>mac"]
client = ["initiator"]
cache = ["warm"]
