# Hosts and links of the benchmark lab, declared by hand. preflight.py checks
# every claim here against what the hosts themselves report, so a wrong entry
# fails loudly instead of quietly measuring another path.

# The host agent.py runs on. It reaches the other endpoint of a link over SSH.
driver = "neo"

[hosts.neo]
ssh = "sanjee@neo.local"      # how the controller and the peers reach it
name = "neo.local"            # the name peers resolve
hostname = "neo"              # what `hostname` must print there
root = "/home/sanjee/benchmarks/xsyncv4/lab"
root_fstype = "ext4"
helper = true

[hosts.freya]
ssh = "sanjee@freya.local"
name = "freya.local"
hostname = "freya"
root = "/mnt/nvme/xsbench"    # ext4 on NVMe; the home directory is ZFS
root_fstype = "ext4"
helper = true

# Inventoried 2026-10-12; helper installed 2026-10-13. A Ryzen 9 7900X on
# NVMe, wired to a mesh node. It cannot yet SSH to neo or freya.
[hosts.mars]
ssh = "sanjee@mars.local"
name = "mars.local"
hostname = "mars"
root = "/home/sanjee/benchmarks/xsyncv4/lab"
root_fstype = "ext4"
helper = true

# Inventoried 2026-10-13. A Raspberry Pi 4 on an NVMe drive behind a USB
# bridge, wired by eth0 to a mesh node whose backhaul to mars's node is
# wireless. Its own wlan0 must stay off: with both up, the name resolves to
# either address and replies leave by eth0 whichever one a packet came in on.
[hosts.orion]
ssh = "sanjee@orion.local"
name = "orion.local"
hostname = "orion"
root = "/home/sanjee/benchmarks/xsyncv4/lab"
root_fstype = "ext4"
helper = true

# The controller itself, as an endpoint for the supplementary Mac experiments.
# `local` hosts are driven without SSH. It is a busy workstation with no
# helper; the .noindex suffix keeps Spotlight out of the benchmark root.
[hosts.mac]
local = true
ssh = "sanjee@mbp-3.local"
name = "mbp-3.local"
hostname = "mbp-3"
root = "/Users/sanjee/benchmarks/xsbench.noindex"
helper = false

# medium: "wired" and "wireless" must match the interface each host uses.
# "mesh" means a wireless hop somewhere on the path, whatever the hosts' own
# interfaces are, so it is not checked against them.
[links.lan]
hosts = ["neo", "freya"]
medium = "wired"
min_speed_mbps = 1000
max_rtt_ms = 2.0
interface = { neo = "eth0", freya = "enp10s0" }

[links.mesh]
hosts = ["neo", "mars"]
medium = "mesh"
interface = { neo = "eth0", mars = "enp9s0" }

# The Wi-Fi pair: orion and mars, both wired to mesh nodes with a wireless hop
# between them. A Pi 4 and a 7900X here against a Pi 5 and a 7950X on the LAN,
# so that what differs is mostly the hop. mars drives; results go to
# benchmarks/results/wifi/.
[links.wifi]
hosts = ["orion", "mars"]
medium = "mesh"
driver = "mars"
results = "wifi"
interface = { orion = "eth0", mars = "enp9s0" }

# Supplementary: this Mac and mars. Only the Mac can start a connection (it
# accepts no SSH), so it is the driver and the SSH client in both directions.
# Results go to benchmarks/results/supplementary/, apart from the path
# experiments, and its runs give way to theirs.
[links.mac-mars]
hosts = ["mac", "mars"]
medium = "mesh"
initiator = "mac"
driver = "mac"
results = "supplementary"
background = true
interface = { mac = "en8", mars = "enp9s0" }
