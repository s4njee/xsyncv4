# Hosts and links of the benchmark lab, declared by hand. preflight.py checks
# every claim here against what the hosts themselves report, so a wrong entry
# fails loudly instead of quietly measuring another path.

# The host agent.py runs on. It reaches the other endpoint of a link over SSH.
driver = "neo"

[hosts.neo]
ssh = "sanjee@neo.local"      # how the controller and the peers reach it
name = "neo.local"            # the name peers resolve
hostname = "neo"              # what `hostname` must print there
root = "/home/sanjee/benchmarks/xsyncv4/lab"
root_fstype = "ext4"
helper = true

[hosts.freya]
ssh = "sanjee@freya.local"
name = "freya.local"
hostname = "freya"
root = "/mnt/nvme/xsbench"    # ext4 on NVMe; the home directory is ZFS
root_fstype = "ext4"
helper = true

# Inventoried 2026-10-12; helper installed 2026-10-13. A Ryzen 9 7900X on
# NVMe, wired to a mesh node. It cannot yet SSH to neo or freya.
[hosts.mars]
ssh = "sanjee@mars.local"
name = "mars.local"
hostname = "mars"
root = "/home/sanjee/benchmarks/xsyncv4/lab"
root_fstype = "ext4"
helper = true

# mars again, with its benchmark root on the hard drive: an HGST Ultrastar
# 7K6000 6 TB (SATA, 7,200 rpm), btrfs, bfq scheduler, which also holds the
# operator's own files. Everything the harness writes stays under
# /mnt/hdd/xsbench. For tuning small and mixed files against a spinning disk.
[hosts.mars-hdd]
ssh = "sanjee@mars.local"
name = "mars.local"
hostname = "mars"
root = "/mnt/hdd/xsbench"
root_fstype = "btrfs"
helper = true

# Inventoried 2026-10-13. A Raspberry Pi 4 on an NVMe drive behind a USB
# bridge, wired by eth0 to a mesh node whose backhaul to mars's node is
# wireless. Its own wlan0 must stay off: with both up, the name resolves to
# either address and replies leave by eth0 whichever one a packet came in on.
[hosts.orion]
ssh = "sanjee@orion.local"
name = "orion.local"
hostname = "orion"
root = "/home/sanjee/benchmarks/xsyncv4/lab"
root_fstype = "ext4"
helper = true

# The controller itself, as an endpoint for the supplementary Mac experiments.
# `local` hosts are driven without SSH. It is a busy workstation with no
# helper; the .noindex suffix keeps Spotlight out of the benchmark root.
[hosts.mac]
local = true
ssh = "sanjee@mbp-3.local"
name = "mbp-3.local"
hostname = "MacBookPro"     # what `hostname` prints; mbp-3 is its Bonjour name
root = "/Users/sanjee/benchmarks/xsbench.noindex"
helper = false

# medium: "wired" and "wireless" must match the interface each host uses.
# "mesh" means a wireless hop somewhere on the path, whatever the hosts' own
# interfaces are, so it is not checked against them.
[links.lan]
hosts = ["neo", "freya"]
medium = "wired"
min_speed_mbps = 1000
max_rtt_ms = 2.0
interface = { neo = "eth0", freya = "enp10s0" }

[links.mesh]
hosts = ["neo", "mars"]
medium = "mesh"
interface = { neo = "eth0", mars = "enp9s0" }

# The Wi-Fi pair: orion and mars, both wired to mesh nodes with a wireless hop
# between them. A Pi 4 and a 7900X here against a Pi 5 and a 7950X on the LAN,
# so that what differs is mostly the hop. mars drives; results go to
# benchmarks/results/wifi/.
[links.wifi]
hosts = ["orion", "mars"]
medium = "mesh"
driver = "mars"
results = "wifi"
interface = { orion = "eth0", mars = "enp9s0" }

# Supplementary: this Mac and mars. Only the Mac can start a connection (it
# accepts no SSH), so it is the driver and the SSH client in both directions.
# Results go to benchmarks/results/supplementary/, apart from the path
# experiments, and its runs give way to theirs.
[links.mac-mars]
hosts = ["mac", "mars"]
medium = "mesh"
initiator = "mac"
driver = "mac"
results = "supplementary"
background = true
interface = { mac = "en8", mars = "enp9s0" }

# On 2026-10-15 the X540 moved from a chipset PCIe 2.0 x1 slot, which held the
# link to about 3.4 Gb/s each way whatever the Mac's adapter, to an x8 slot;
# its port is now enp1s0f0.
# Since 2026-10-15 evening the Mac's end is a Thunderbolt 4 10GbE adapter
# (en13, Aquantia, linked at 10GBASE-T); before that a USB adapter (en11)
# that held TCP to about 3 Gb/s.
# Direct cable between this Mac and mars, for large-file tuning (2026-10-14):
# the Mac's USB adapter (10 Gb/s USB, en11, 10.25.0.1) to mars's Intel X540
# (enp7s0f0, 10.25.0.2), linked at 10 Gb/s; USB holds it to about 3 Gb/s of
# TCP each way, and the Mac's driver allows no jumbo frames. mars is reached
# at its address on this cable, not by name (its name resolves to Wi-Fi).
[links.mac-mars-direct]
hosts = ["mac", "mars"]
medium = "wired"
min_speed_mbps = 10000
max_rtt_ms = 2.0
initiator = "mac"
driver = "mac"
results = "direct"
address = { mac = "10.25.0.1", mars = "10.25.0.2" }
interface = { mac = "en13", mars = "enp1s0f0" }

# Mac to mars over mars's onboard 2.5GbE port, once the GPU is back in the x8 slot
# (2026-10-16/17). The Mac keeps its Thunderbolt adapter, which also runs at 2.5
# Gb/s, and both ends keep their direct-cable addresses. mars's interface name is
# the X870 board's; it changes with the motherboard swap of 2026-10-17 and must be
# set again then.
[links.mac-mars-2g5]
hosts = ["mac", "mars"]
medium = "wired"
min_speed_mbps = 2500
max_rtt_ms = 2.0
initiator = "mac"
driver = "mac"
results = "pipes"
address = { mac = "10.25.0.1", mars = "10.25.0.2" }
interface = { mac = "en13", mars = "enp9s0" }

[links.mac-mars-hdd-2g5]
hosts = ["mac", "mars-hdd"]
medium = "wired"
min_speed_mbps = 2500
max_rtt_ms = 2.0
initiator = "mac"
driver = "mac"
results = "hdd"
address = { mac = "10.25.0.1", mars-hdd = "10.25.0.2" }
interface = { mac = "en13", mars-hdd = "enp9s0" }

# The same cable, with mars's end on its hard drive (2026-10-15).
[links.mac-mars-hdd]
hosts = ["mac", "mars-hdd"]
medium = "wired"
min_speed_mbps = 10000
max_rtt_ms = 2.0
initiator = "mac"
driver = "mac"
results = "hdd"
address = { mac = "10.25.0.1", mars-hdd = "10.25.0.2" }
interface = { mac = "en13", mars-hdd = "enp1s0f0" }
