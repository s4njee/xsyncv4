# E1b: does it matter which end starts the transfer? Every v4 measurement
# before this harness had neo as the SSH client, so direction and client role
# were confounded. Here each block runs the same transfer started from the
# sender (a push) and from the receiver (a pull), for both tools.
# Analyse the rsync pair with: report.py ... --control rsync-push
id = "E1b-client"
kind = "confirmatory"
hypothesis = "A transfer started by the receiver takes the same time, within 3%, as the same transfer started by the sender."
primary = "wall_s"
delta = 0.03
blocks = 10
control = "xs-push"
verify = "first-last"

[arms.xs-push]
tool = "xs"
rev = "bf596d28c5c9"
flags = ["-a"]
client = "sender"

[arms.xs-pull]
tool = "xs"
rev = "bf596d28c5c9"
flags = ["-a"]
client = "receiver"

[arms.rsync-push]
tool = "rsync"
flags = ["-a"]
client = "sender"

[arms.rsync-pull]
tool = "rsync"
flags = ["-a"]
client = "receiver"

[matrix]
link = "lan"
corpus = ["small-flat", "mixed-bimodal"]
scenario = ["fresh", "noop"]
direction = ["neo>freya", "freya>neo"]
client = ["arm"]
cache = ["warm"]
