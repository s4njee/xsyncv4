# X1b: the same arms on four 2 GiB files and on 32 files of 16 MiB to 1 GiB,
# from mars to the Mac only (the Mac starts them; its ssh prefers AES-128-GCM): the Mac has no room to hold these as sources.
id = "X1b-large-many"
kind = "screening"
hypothesis = "On a ~3 Gb/s direct link, xs -a copies large files at least as fast as rsync -a, and ChaCha20 slows both against AES-GCM."
primary = "durable_s"
delta = 0.03
blocks = 8
control = "rsync"
verify = "first-last"
cleanup = "eager"

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[arms.rsync-chacha]
tool = "rsync"
flags = ["-a"]
ssh_options = ["-c", "chacha20-poly1305@openssh.com"]

[arms.xs]
tool = "xs"
rev = "8cc75bbdb801"
flags = ["-a"]

[arms.xs-chacha]
tool = "xs"
rev = "8cc75bbdb801"
flags = ["-a"]
ssh_options = ["-c", "chacha20-poly1305@openssh.com"]

[matrix]
link = "mac-mars-direct"
corpus = ["large-four", "large-mixed"]
scenario = ["fresh"]
direction = ["mars>mac"]
client = ["initiator"]
cache = ["warm"]
