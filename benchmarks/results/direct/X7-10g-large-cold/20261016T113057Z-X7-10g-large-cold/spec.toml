# X7: large files off mars's NVMe with cold caches, the Mac receiving.
id = "X7-10g-large-cold"
kind = "screening"
hypothesis = "From a cold NVMe drive xs still copies large files at what one ssh connection carries."
primary = "durable_s"
delta = 0.03
blocks = 6
control = "rsync"
verify = "first-last"
cleanup = "eager"

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[arms.xs]
tool = "xs"
rev = "8cc75bbdb801"
flags = ["-a"]

[matrix]
link = "mac-mars-direct"
corpus = ["large-one", "large-mixed"]
scenario = ["fresh"]
direction = ["mars>mac"]
client = ["initiator"]
cache = ["cold"]
