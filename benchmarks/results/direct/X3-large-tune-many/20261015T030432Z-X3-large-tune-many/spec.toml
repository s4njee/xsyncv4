# X3: the same settings on four 2 GiB files and on 32 mixed large files, from
# mars to the Mac (the Mac cannot hold these as sources).
id = "X3-large-tune-many"
kind = "screening"
hypothesis = "The settings that help one large file also help several, or matter less there."
primary = "durable_s"
delta = 0.03
blocks = 6
control = "xs"
verify = "first-last"
cleanup = "eager"

[arms.xs]
tool = "xs"
rev = "453704a64528-tune"
flags = ["-a"]
metrics = true

[arms.j4]
tool = "xs"
rev = "453704a64528-tune"
flags = ["-a", "-j4"]
metrics = true

[arms.j8]
tool = "xs"
rev = "453704a64528-tune"
flags = ["-a", "-j8"]
metrics = true

[arms.block4m]
tool = "xs"
rev = "453704a64528-tune"
flags = ["-a"]
tune = "block_target=4194304"
metrics = true

[arms.chunk1m]
tool = "xs"
rev = "453704a64528-tune"
flags = ["-a"]
tune = "write_chunk=1048576,pipe_size=1048576"
metrics = true

[arms.queues]
tool = "xs"
rev = "453704a64528-tune"
flags = ["-a"]
tune = "send_queue=201326592,recv_queue=67108864"
metrics = true

[matrix]
link = "mac-mars-direct"
corpus = ["large-four", "large-mixed"]
scenario = ["fresh"]
direction = ["mars>mac"]
client = ["initiator"]
cache = ["warm"]
