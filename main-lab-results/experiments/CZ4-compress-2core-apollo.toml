# Part of T19-until-sunday (2026-10-23): one tree for the Mac-apollo runner until Sunday 07:00 Central.
# The same arms at full link speed with apollo held to 2 cores: the slow-CPU end of the policy on a fast link.
# xs-rs with -z picks its level by itself (PR #34: starts at 1, steps up only while its measured compression keeps up), against fixed levels 1, 3 and 6, no -z, the old policy (e671c84) and rsync with and without -z.
# Six arms fit a block: rsync -z and level 6 left out (a fast link has no use for level 6).
id = "CZ4-compress-2core-apollo"
kind = "screening"
hypothesis = "With apollo held to 2 cores, xs-rs -z at its automatic level is within 5% of the fastest fixed level."
primary = "durable_s"
delta = 0.05
blocks = 2
control = "xs-rs-z"
verify = "first-last"
cleanup = "eager"
max_hours = 1.5
sample_timeout_s = 3600
cpus = { host = "apollo", count = 2 }

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[arms.xs-rs]
tool = "xs"
rev = "ac1aeef00c80-rs"
flags = ["-a"]

[arms.xs-rs-z]
tool = "xs"
rev = "ac1aeef00c80-rs"
flags = ["-a", "-z"]

[arms.xs-rs-z1]
tool = "xs"
rev = "ac1aeef00c80-rs"
flags = ["-a", "-z", "--compress-level=1"]

[arms.xs-rs-z3]
tool = "xs"
rev = "ac1aeef00c80-rs"
flags = ["-a", "-z", "--compress-level=3"]

[arms.xs-rs-base-z]
tool = "xs"
rev = "e671c84aa680-rs"
flags = ["-a", "-z", "-j4"]

[matrix]
link = "mac-apollo-10g"
corpus = ["real-congress", "large-text"]
scenario = ["fresh"]
direction = ["mac>apollo", "apollo>mac"]
client = ["initiator"]
cache = ["warm"]
