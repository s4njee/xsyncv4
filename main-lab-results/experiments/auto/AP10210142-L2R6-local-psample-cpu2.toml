# Written by the 6-hourly planner (2026-10-21T01:42Z). Why: Step 1 (reproduce, split by factor): this is the one home cell where xs already trails rsync on a real-projects proxy, and it shows whether a 2-CPU cap deepens that loss.
id = "AP10210142-L2R6-local-psample-cpu2"
kind = "screening"
hypothesis = "With 2 CPUs, xs -a -j4 is more than 15% slower than rsync -a on a fresh cold local real-psample copy, which would point at CPU contention among its workers."
primary = "durable_s"
delta = 0.05
blocks = 8
control = "xs-j4"
verify = "first-last"
cleanup = "eager"
sample_timeout_s = 7200
cpus = { host = "neo", count = 2 }

[arms.xs-j4]
tool = "xs"
rev = "e51c1df1329a"
flags = ["-a", "-j4"]

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[matrix]
link = "neo-local-ssd"
corpus = ["real-psample"]
scenario = ["fresh"]
direction = ["neo>neo-ssd"]
client = ["receiver"]
cache = ["cold"]
