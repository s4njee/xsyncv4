# Written by the 6-hourly planner (2026-10-21T01:42Z). Why: Step 1 (reproduce, split by factor): it measures the CPU cap's effect where no network latency can contribute.
id = "AP10210142-L2R5-local-congress-cpu2"
kind = "screening"
hypothesis = "With 2 CPUs, xs -a -j4's lead over rsync -a on a fresh local real-congress copy falls well below J2's 1.84x, showing that xs's small-file advantage depends on spare cores."
primary = "durable_s"
delta = 0.05
blocks = 12
control = "xs-j4"
verify = "first-last"
cleanup = "eager"
sample_timeout_s = 7200
cpus = { host = "neo", count = 2 }

[arms.xs-j4]
tool = "xs"
rev = "e51c1df1329a"
flags = ["-a", "-j4"]

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[matrix]
link = "neo-local-ssd"
corpus = ["real-congress"]
scenario = ["fresh"]
direction = ["neo>neo-ssd"]
client = ["receiver"]
cache = ["warm"]
