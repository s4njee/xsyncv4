# Written by the 6-hourly planner (2026-10-21T07:51Z). Why: Three home attempts capped only the sender and xs still led by 1.4x or more; lab2's receiver is also a 2-vCPU arm64 machine, and that condition is untested.
id = "AP10210751-AP10210749-L2R7-congress-pull-wan11-cpu2"
kind = "screening"
hypothesis = "With neo receiving under an 11 ms round trip and a 2-CPU cap, rsync -a's time-to-durable comes within 5% of xs -a -j4 or beats it, unlike the plain mars>neo cell where rsync was 1.34x slower (J1d)."
primary = "durable_s"
delta = 0.05
blocks = 12
control = "xs-j4"
verify = "first-last"
cleanup = "eager"
sample_timeout_s = 7200
wan = { host = "neo", delay_ms = 11, loss_pct = 0 }
cpus = { host = "neo", count = 2 }

[arms.xs-j4]
tool = "xs"
rev = "e51c1df1329a"
flags = ["-a", "-j4"]

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[matrix]
link = "neo-mars-lan"
corpus = ["real-congress"]
scenario = ["fresh"]
direction = ["mars>neo"]
client = ["initiator"]
