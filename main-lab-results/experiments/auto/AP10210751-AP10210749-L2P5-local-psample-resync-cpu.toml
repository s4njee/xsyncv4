# Written by the 6-hourly planner (2026-10-21T07:51Z). Why: L2R6 covers the fresh copy under 2 CPUs; the re-sync cells of this large tree are unmeasured under the cap and in lab2.
id = "AP10210751-AP10210749-L2P5-local-psample-resync-cpu"
kind = "screening"
hypothesis = "Under a 2-CPU cap, xs -a -j4 stays at least 5% faster than rsync -a at the real-psample no-op, as on the plain link (about 0.5x, LC4), but its lead at the 1% update is under 5%."
primary = "durable_s"
delta = 0.05
blocks = 4
control = "xs-j4"
verify = "first-last"
cleanup = "eager"
sample_timeout_s = 7200
cpus = { host = "neo", count = 2 }

[arms.xs-j4]
tool = "xs"
rev = "e51c1df1329a"
flags = ["-a", "-j4"]

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[matrix]
link = "neo-local-ssd"
corpus = ["real-psample"]
scenario = ["noop", "update-1pct"]
direction = ["neo>neo-ssd"]
client = ["receiver"]
cache = ["cold"]
