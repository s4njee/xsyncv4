# MA8 (tree T17): the parent-descriptor budget fix (e51c1df1329a) on the cell that found it. Pulling
# psample (547,983 directories) from mars onto the Mac, xs walked every destination directory's path
# from the root, because it kept at most 256 parents open: by hand the fix took a no-op from 50-64 s to
# 29-37 s, where rsync took 50 s. Its parent release and rsync -aH (the control) run beside it.
id = "MA8-psample-pull-anchors"
kind = "confirmatory"
hypothesis = "With a larger parent-descriptor budget, xs -aH re-syncs psample onto the Mac faster than its parent and than rsync -aH, at a no-op and after 1% of files change."
primary = "wall_s"
delta = 0.05
blocks = 8
control = "rsync"
verify = "first-last"
sample_timeout_s = 7200

[arms.rsync]
tool = "rsync"
flags = ["-aH"]

[arms.xs]
tool = "xs"
rev = "21ae6844ed20"
flags = ["-aH"]

[arms.xs-anchors]
tool = "xs"
rev = "e51c1df1329a"
flags = ["-aH"]

[matrix]
link = "mac-mars-10g"
corpus = ["real-psample"]
scenario = ["noop", "update-1pct"]
direction = ["mars>mac"]
client = ["initiator"]
cache = ["warm"]
