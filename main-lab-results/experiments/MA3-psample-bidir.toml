# MA3 (tree T8, the Mac/mars axis): how fast can the pinned psample tree be copied
# between the Mac (APFS) and mars (ext4) over the direct 10GbE cable (X540), each
# way, and is xs faster than rsync? psample is a byte-faithful sample of ~/projects
# pinned as the real-psample corpus. Trimmed screening: rsync -aH vs xs -aH, both
# directions, four paired blocks. The -z arms are dropped: the tree is essentially
# incompressible (zstd3 ratio 1.01), so compression only adds time. All arms keep
# hard links, which the corpus needs (it has 14 hardlinked Rust incremental .o
# files); without -H every fresh copy fails verification. wall_s avoids charging a
# system-wide Mac sync as transfer time.
id = "MA3-psample-bidir"
kind = "screening"
hypothesis = "On the Mac/mars 10GbE link, xs copies the pinned psample tree faster than rsync -aH, fresh, in both directions."
primary = "wall_s"
delta = 0.05
blocks = 4
control = "rsync"
verify = "first-last"
cleanup = "eager"
sample_timeout_s = 7200

[arms.rsync]
tool = "rsync"
flags = ["-aH"]

[arms.xs]
tool = "xs"
rev = "8cc75bbdb801"
flags = ["-aH"]

[matrix]
link = "mac-mars-10g"
corpus = ["real-psample"]
scenario = ["fresh"]
direction = ["mac>mars", "mars>mac"]
client = ["initiator"]
cache = ["warm"]
