# Part of T19-until-sunday (2026-10-23): one tree for the Mac-apollo runner until Sunday 07:00 Central.
# EXC C1: how much of the large-file ceiling is the one ssh connection? xs and rsync against bare tar pipes on 1 and 8 streams.
id = "XC1-ssh-ceiling-apollo"
kind = "screening"
hypothesis = "A bare pipe on 8 streams is at least 5% faster than xs on large files over the cable."
primary = "durable_s"
delta = 0.05
blocks = 3
control = "xs-cpp"
verify = "first-last"
cleanup = "eager"
max_hours = 1.5
sample_timeout_s = 3600

[arms.xs-cpp]
tool = "xs"
rev = "cc8288d4f08c"
flags = ["-a", "-j4"]

[arms.xs-rs]
tool = "xs"
rev = "ac1aeef00c80-rs"
flags = ["-a"]

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[arms.pipe-x1]
tool = "pipe"
streams = 1

[arms.pipe-x8]
tool = "pipe"
streams = 8

[matrix]
link = "mac-apollo-10g"
corpus = ["hs-1x4g", "hs-16x256m"]
scenario = ["fresh"]
direction = ["mac>apollo"]
client = ["initiator"]
cache = ["warm"]
