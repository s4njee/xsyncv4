# Part of T19-until-sunday (2026-10-23): one tree for the Mac-apollo runner until Sunday 07:00 Central.
# The same arms held to 100 Mb/s by --bwlimit; congress only, since 8 GiB uncompressed takes 11 minutes at that rate.
# xs-rs with -z picks its level by itself (PR #34: starts at 1, steps up only while its measured compression keeps up), against fixed levels 1, 3 and 6, no -z, the old policy (e671c84) and rsync with and without -z.
# Six arms fit a block: rsync -z and the old policy left out; at 100 Mb/s level 6 stays in.
id = "CZ3-compress-100m-apollo"
kind = "screening"
hypothesis = "Held to 100 Mb/s, xs-rs -z at its automatic level is within 5% of the fastest fixed level, and compression beats none."
primary = "durable_s"
delta = 0.05
blocks = 2
control = "xs-rs-z"
verify = "first-last"
cleanup = "eager"
max_hours = 1.5
sample_timeout_s = 3600

[arms.rsync]
tool = "rsync"
flags = ["-a", "--bwlimit=12207"]

[arms.xs-rs]
tool = "xs"
rev = "ac1aeef00c80-rs"
flags = ["-a", "--bwlimit=12207"]

[arms.xs-rs-z]
tool = "xs"
rev = "ac1aeef00c80-rs"
flags = ["-a", "-z", "--bwlimit=12207"]

[arms.xs-rs-z1]
tool = "xs"
rev = "ac1aeef00c80-rs"
flags = ["-a", "-z", "--compress-level=1", "--bwlimit=12207"]

[arms.xs-rs-z3]
tool = "xs"
rev = "ac1aeef00c80-rs"
flags = ["-a", "-z", "--compress-level=3", "--bwlimit=12207"]

[arms.xs-rs-z6]
tool = "xs"
rev = "ac1aeef00c80-rs"
flags = ["-a", "-z", "--compress-level=6", "--bwlimit=12207"]

[matrix]
link = "mac-apollo-10g"
corpus = ["real-congress"]
scenario = ["fresh"]
direction = ["mac>apollo", "apollo>mac"]
client = ["initiator"]
cache = ["warm"]
