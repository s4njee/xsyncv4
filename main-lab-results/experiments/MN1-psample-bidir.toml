# T11: fresh psample copies between the Mac (APFS) and neo (ext4).
# Independent identities and link; never pool with Mac/mars observations.
# Trimmed screening: rsync -aH vs xs -aH, both directions, four paired blocks.
# The -z arms are dropped: the pinned psample tree is essentially incompressible
# (zstd3 ratio 1.01), so compression only adds time. All arms retain hard links,
# which the corpus needs (it has 14 hardlinked Rust incremental .o files).
# wall_s avoids charging a system-wide Mac sync as transfer time.
id = "MN1-psample-bidir"
kind = "screening"
hypothesis = "On the direct Mac/neo link, xs copies the pinned psample tree faster than rsync -aH, fresh, in both directions."
primary = "wall_s"
delta = 0.05
blocks = 4
control = "rsync"
verify = "first-last"
cleanup = "eager"
sample_timeout_s = 7200

[arms.rsync]
tool = "rsync"
flags = ["-aH"]

[arms.xs]
tool = "xs"
rev = "8cc75bbdb801"
flags = ["-aH"]

[matrix]
link = "mac-neo-direct"
corpus = ["real-psample"]
scenario = ["fresh"]
direction = ["mac>neo", "neo>mac"]
client = ["initiator"]
cache = ["warm"]
