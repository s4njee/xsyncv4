# F4a (tree T4 fill): a short replicate of xs against rsync between the Pi and mars, both ways,
# repeated while the tree has nothing else to run, so drift over the weekend is measured.
id = "F4a-pair-replicate"
kind = "screening"
hypothesis = "xs's best setting with -z stays ahead of rsync -az from run to run."
primary = "durable_s"
delta = 0.03
blocks = 3
control = "xs-z"
verify = "first-last"
cleanup = "eager"

[arms.xs-z]
tool = "xs"
rev = "453704a64528-tune"
metrics = true
flags = ["-az"]

[arms.xs-z-best]
tool = "xs"
rev = "453704a64528-tune"
metrics = true
flags = ["-az", "--no-atomic"]
tune = { receiver = "jobs=4" }

[arms.rsync-z]
tool = "rsync"
flags = ["-az"]

[matrix]
link = "neo-mars-1g"
corpus = ["small-flat", "real-congress", "mixed-bimodal"]
scenario = ["fresh"]
direction = ["neo>mars", "mars>neo"]
client = ["initiator"]
cache = ["warm"]
