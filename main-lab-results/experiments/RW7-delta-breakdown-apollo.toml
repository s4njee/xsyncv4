# Part of T19-until-sunday (2026-10-23): one tree for the Mac-apollo runner until Sunday 07:00 Central.
# RW1 found rsync faster on delta updates of large files. Which part loses: each tool with and without --whole-file,
# so the delta path and the plain copy are timed apart, on one large file, eight and sixteen; 1% and 10% of files edited, and an append.
# Six arms fit a block: xs-c++ -j1 left out; the --whole-file pairs carry the question.
id = "RW7-delta-breakdown-apollo"
kind = "screening"
hypothesis = "rsync is at least 5% faster than xs in some delta cell, and xs with --whole-file shows whether xs's delta path or its copy is the cause."
primary = "durable_s"
delta = 0.05
blocks = 2
control = "rsync"
verify = "first-last"
cleanup = "eager"
max_hours = 4
sample_timeout_s = 3600

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[arms.rsync-W]
tool = "rsync"
flags = ["-a", "-W"]

[arms.xs-cpp]
tool = "xs"
rev = "cc8288d4f08c"
flags = ["-a", "-j4"]

[arms.xs-cpp-W]
tool = "xs"
rev = "cc8288d4f08c"
flags = ["-a", "-j4", "--whole-file"]

[arms.xs-rs]
tool = "xs"
rev = "ac1aeef00c80-rs"
flags = ["-a"]

[arms.xs-rs-W]
tool = "xs"
rev = "ac1aeef00c80-rs"
flags = ["-a", "--whole-file"]

[matrix]
link = "mac-apollo-10g"
corpus = ["large-solo", "large-text", "hs-16x256m"]
scenario = ["update-1pct", "update-10pct", "append-1pct"]
direction = ["mac>apollo", "apollo>mac"]
client = ["initiator"]
cache = ["warm"]
