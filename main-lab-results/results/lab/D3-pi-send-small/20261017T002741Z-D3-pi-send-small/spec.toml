# D3 (decision tree T1, after K2a, if freya's filesystem does not matter): the
# Pi sending small trees is the limit. T1g found no sending-worker setting a
# free win on mixed trees and no-ops; this asks the same of fresh small trees
# with xs's best receiver setting: compression off (the Pi's CPU), three
# sending workers (room for ssh), larger read batches, and larger frames.
id = "D3-pi-send-small"
kind = "screening"
hypothesis = "Turning compression off, leaving ssh a core, or batching reads makes the Pi send small trees faster."
primary = "durable_s"
delta = 0.03
blocks = 8
control = "xs-z-best"
verify = "first-last"
cleanup = "eager"

[arms.xs-z-best]
tool = "xs"
rev = "453704a64528-tune"
metrics = true
flags = ["-az", "--no-atomic"]
tune = { receiver = "jobs=4" }

[arms.xs-best]
tool = "xs"
rev = "453704a64528-tune"
metrics = true
flags = ["-a", "--no-atomic"]
tune = { receiver = "jobs=4" }

[arms.send3]
tool = "xs"
rev = "453704a64528-tune"
metrics = true
flags = ["-az", "--no-atomic"]
tune = { receiver = "jobs=4", sender = "jobs=3" }

[arms.batch256]
tool = "xs"
rev = "453704a64528-tune"
metrics = true
flags = ["-az", "--no-atomic"]
tune = { receiver = "jobs=4", sender = "read_batch_files=256,read_batch_bytes=33554432" }

[arms.coalesce1m]
tool = "xs"
rev = "453704a64528-tune"
metrics = true
flags = ["-az", "--no-atomic"]
tune = { receiver = "jobs=4", sender = "coalesce_under=65536,coalesce_to=1048576" }

[matrix]
link = "lan"
corpus = ["real-congress", "small-deep", "small-flat"]
scenario = ["fresh"]
direction = ["neo>freya"]
client = ["sender"]
cache = ["warm"]
