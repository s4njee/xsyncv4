# X5b: X5's Mac-to-mars half again with the Mac idle. In X5 and X6 the Mac was
# heavily loaded and its ssh process starved; the same copy took 9.8 to 28 s.
id = "X5b-10g-large-to-mars"
kind = "screening"
hypothesis = "From an idle Mac, xs copies large files at what one ssh connection carries."
primary = "durable_s"
delta = 0.03
blocks = 8
control = "rsync"
verify = "first-last"
cleanup = "eager"
hours = [23, 7]  # the Mac sends: run while it is idle overnight

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[arms.xs]
tool = "xs"
rev = "8cc75bbdb801"
flags = ["-a"]

[matrix]
link = "mac-mars-direct"
corpus = ["large-one", "large-four", "large-mixed"]
scenario = ["fresh"]
direction = ["mac>mars"]
client = ["initiator"]
cache = ["warm"]
