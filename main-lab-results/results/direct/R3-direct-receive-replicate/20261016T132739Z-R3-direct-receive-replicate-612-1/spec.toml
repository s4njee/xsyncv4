# R3: filler for daytime. xs against rsync on small and mixed trees, mars to
# the Mac, repeated through the two days: whether the ratios hold from run to
# run on this link.
id = "R3-direct-receive-replicate"
kind = "screening"
hypothesis = "The xs to rsync ratios on small and mixed trees into the Mac hold from run to run."
primary = "durable_s"
