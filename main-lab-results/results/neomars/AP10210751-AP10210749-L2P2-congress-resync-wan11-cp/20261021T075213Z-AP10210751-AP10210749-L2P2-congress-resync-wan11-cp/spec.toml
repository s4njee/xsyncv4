# Written by the 6-hourly planner (2026-10-21T07:51Z). Why: Re-syncs depend on round trips and sender CPU, and lab2 has reported no re-sync cell for congress, so a loss here would surface at home first.
id = "AP10210751-AP10210749-L2P2-congress-resync-wan11-cp"
kind = "screening"
