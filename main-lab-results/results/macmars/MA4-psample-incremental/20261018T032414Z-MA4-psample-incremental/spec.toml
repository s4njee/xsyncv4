# MA4 (tree T12): the incremental cases on the pinned psample tree — a warm no-op and a
# 1% update, both directions, on mac/mars. Fresh copies (MA3) are the easy case; H21 says
# no-op is where xs should win most, yet v4 showed a 0.74x push deficit on congress. A
# 711k-file tree at 10GbE is the place to settle it. rsync -aH is the control. update-1pct
# seeds the destination, mutates 1% of the files and re-syncs, so it costs a full seed too.
id = "MA4-psample-incremental"
kind = "screening"
hypothesis = "On mac/mars, xs re-syncs the psample tree faster than rsync -aH, warm: a no-op, and after 1% of the files change."
primary = "wall_s"
delta = 0.05
blocks = 4
control = "rsync"
verify = "first-last"
cleanup = "eager"
sample_timeout_s = 7200

[arms.rsync]
tool = "rsync"
flags = ["-aH"]

[arms.xs]
tool = "xs"
rev = "8cc75bbdb801"
flags = ["-aH"]

[matrix]
link = "mac-mars-10g"
corpus = ["real-psample"]
scenario = ["noop", "update-1pct"]
direction = ["mac>mars", "mars>mac"]
client = ["initiator"]
cache = ["warm"]
