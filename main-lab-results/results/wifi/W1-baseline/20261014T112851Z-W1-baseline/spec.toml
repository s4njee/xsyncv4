# W1: E1 on the Wi-Fi pair. The same arms, scenarios and block count as
# E1v2 on the wired pair, with a Pi 4 and a 7900X where that has a Pi 5 and a
# 7950X, so the two tables can be read side by side: where the ratios agree,
# the wireless hop asks for nothing special; where they part, that cell is
# where Wi-Fi tuning starts. small-real joins when it has been copied over.
id = "W1-baseline"
kind = "confirmatory"
hypothesis = "xs -a against rsync -a on the Wi-Fi pair gives the ratios it gives on the wired pair, cell by cell."
primary = "durable_s"
delta = 0.03
blocks = 12
control = "rsync"
verify = "first-last"

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[arms.xs]
tool = "xs"
rev = "8cc75bbdb801"
flags = ["-a"]

[matrix]
link = "wifi"
corpus = ["tiny-one", "small-flat", "small-deep", "small-opaque", "mixed-bimodal", "mixed-threshold"]
scenario = ["fresh", "noop"]
direction = ["orion>mars", "mars>orion"]
client = ["sender"]
cache = ["warm"]
