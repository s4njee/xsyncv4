# H0 (tree T4, start): neo (Raspberry Pi 5) and mars (Ryzen 9 7900X) on wired gigabit, both ways:
# xs with compression, its best small-file setting, and rsync -az, on small, real, mixed and
# large trees. Where each tool stands before the tree asks which side is the limit.
id = "H0-pair-baseline"
kind = "screening"
hypothesis = "xs with its best small-file setting is faster than rsync -az both ways on every tree."
primary = "durable_s"
delta = 0.03
blocks = 8
control = "xs-z"
verify = "first-last"
cleanup = "eager"

[arms.xs-z]
tool = "xs"
rev = "453704a64528-tune"
metrics = true
flags = ["-az"]

[arms.xs-z-best]
tool = "xs"
rev = "453704a64528-tune"
metrics = true
flags = ["-az", "--no-atomic"]
tune = { receiver = "jobs=4" }

[arms.rsync-z]
tool = "rsync"
flags = ["-az"]

[matrix]
link = "neo-mars-1g"
corpus = ["small-flat", "small-deep", "real-congress", "mixed-bimodal", "large-text"]
scenario = ["fresh"]
direction = ["neo>mars", "mars>neo"]
client = ["initiator"]
cache = ["warm"]
