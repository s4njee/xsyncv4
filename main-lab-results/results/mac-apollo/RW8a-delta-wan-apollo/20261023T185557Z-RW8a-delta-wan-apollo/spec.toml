# Part of T19-until-sunday (2026-10-23): one tree for the Mac-apollo runner until Sunday 07:00 Central.
# The delta cells again over a 20 ms round trip (netem on apollo), where a delta pays for its signature exchange in round trips.
id = "RW8a-delta-wan-apollo"
kind = "screening"
hypothesis = "Over a 20 ms round trip, rsync is at least 5% faster than xs in some delta cell."
primary = "durable_s"
delta = 0.05
blocks = 2
control = "rsync"
verify = "first-last"
cleanup = "eager"
max_hours = 2
sample_timeout_s = 3600
wan = { host = "apollo", delay_ms = 20 }

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[arms.xs-cpp]
tool = "xs"
rev = "cc8288d4f08c"
flags = ["-a", "-j4"]

[arms.xs-rs]
tool = "xs"
rev = "ac1aeef00c80-rs"
flags = ["-a"]

[arms.xs-rs-W]
tool = "xs"
rev = "ac1aeef00c80-rs"
flags = ["-a", "--whole-file"]

[matrix]
link = "mac-apollo-10g"
corpus = ["large-text", "hs-16x256m"]
scenario = ["update-1pct", "append-1pct"]
direction = ["mac>apollo", "apollo>mac"]
client = ["initiator"]
cache = ["warm"]
