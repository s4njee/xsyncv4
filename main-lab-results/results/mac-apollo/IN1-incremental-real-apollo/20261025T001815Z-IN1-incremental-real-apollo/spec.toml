# T19-until-sunday, wave 2 (2026-10-23): new questions in place of repeating the sentinel.
# Incremental syncs of real trees, the everyday backup: 0.1%, 1% and 10% of files edited on congress, and 1% on psample.
# RW1 and RW7 cover large files; this is the many-small-files side of the same question.
id = "IN1-incremental-real-apollo"
kind = "screening"
hypothesis = "rsync is at least 5% faster than xs at some incremental sync of a real tree."
primary = "durable_s"
delta = 0.05
blocks = 3
control = "rsync"
verify = "first-last"
cleanup = "eager"
max_hours = 2.5
sample_timeout_s = 3600

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[arms.xs-cpp]
tool = "xs"
rev = "cc8288d4f08c"
flags = ["-a", "-j4"]

[arms.xs-cpp-j8]
tool = "xs"
rev = "cc8288d4f08c"
flags = ["-a", "-j8"]

[arms.xs-rs]
tool = "xs"
rev = "ac1aeef00c80-rs"
flags = ["-a"]

[matrix]
link = "mac-apollo-10g"
corpus = ["real-congress"]
scenario = ["update-0p1pct", "update-1pct", "update-10pct"]
direction = ["mac>apollo", "apollo>mac"]
client = ["initiator"]
cache = ["warm"]
