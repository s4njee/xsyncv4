# Part of T19-until-sunday (2026-10-23): one tree for the Mac-apollo runner until Sunday 07:00 Central.
# The tree's fill until Sunday: one short block of the three tools on congress, fresh and no-op, both ways, repeated for the noise floor.
id = "FS1-sentinel-apollo"
kind = "screening"
hypothesis = "rsync, xs-c++ and xs-rs keep their congress ranking through the weekend."
primary = "durable_s"
delta = 0.05
blocks = 1
control = "rsync"
verify = "first-last"
cleanup = "eager"
max_hours = 0.75
sample_timeout_s = 3600

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[arms.xs-cpp]
tool = "xs"
rev = "cc8288d4f08c"
flags = ["-a", "-j4"]

[arms.xs-rs]
tool = "xs"
rev = "ac1aeef00c80-rs"
flags = ["-a"]

[matrix]
link = "mac-apollo-10g"
corpus = ["real-congress"]
scenario = ["fresh", "noop"]
direction = ["mac>apollo", "apollo>mac"]
client = ["initiator"]
cache = ["warm"]
