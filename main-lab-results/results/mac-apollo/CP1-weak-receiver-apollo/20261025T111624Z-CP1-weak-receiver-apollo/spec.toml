# T19-until-sunday, wave 2 (2026-10-23): new questions in place of repeating the sentinel.
# A weak receiver on a fast link: apollo held to 2 cores while it receives small files and a project tree. Which tool and worker count suit a small NAS?
id = "CP1-weak-receiver-apollo"
kind = "screening"
hypothesis = "With the receiver held to 2 cores, rsync is at least 5% faster than xs in some cell, or fewer xs workers are faster than the default."
primary = "durable_s"
delta = 0.05
blocks = 3
control = "rsync"
verify = "first-last"
cleanup = "eager"
max_hours = 2
sample_timeout_s = 3600
cpus = { host = "apollo", count = 2 }

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[arms.xs-cpp]
tool = "xs"
rev = "cc8288d4f08c"
flags = ["-a", "-j4"]

[arms.xs-cpp-j2]
tool = "xs"
rev = "cc8288d4f08c"
flags = ["-a", "-j2"]

[arms.xs-rs]
tool = "xs"
rev = "ac1aeef00c80-rs"
flags = ["-a"]

[arms.xs-rs-j2]
tool = "xs"
rev = "ac1aeef00c80-rs"
flags = ["-a", "-j2"]

[matrix]
link = "mac-apollo-10g"
corpus = ["real-congress", "local-laikav2"]
scenario = ["fresh", "noop"]
direction = ["mac>apollo"]
client = ["initiator"]
cache = ["warm"]
