# Part of T19-until-sunday (2026-10-23): one tree for the Mac-apollo runner until Sunday 07:00 Central.
# EXA A7 on a Linux receiver: does eager writeback (flush after 64 MiB around each sample) shorten the time to durable on apollo?
id = "WB1-eager-writeback-apollo"
kind = "screening"
hypothesis = "With eager writeback on apollo, xs reaches durable at least 5% sooner than with default writeback."
primary = "durable_s"
delta = 0.05
blocks = 3
control = "xs-cpp"
verify = "first-last"
cleanup = "eager"
max_hours = 1.5
sample_timeout_s = 3600

[arms.xs-cpp]
tool = "xs"
rev = "cc8288d4f08c"
flags = ["-a", "-j4"]

[arms.xs-cpp-eager]
tool = "xs"
rev = "cc8288d4f08c"
flags = ["-a", "-j4"]
writeback = "eager"

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[arms.rsync-eager]
tool = "rsync"
flags = ["-a"]
writeback = "eager"

[matrix]
link = "mac-apollo-10g"
corpus = ["real-congress", "local-laikav2", "hs-16x256m"]
scenario = ["fresh"]
direction = ["mac>apollo"]
client = ["initiator"]
cache = ["warm"]
