# G3 (tree T3): small and mixed trees use a fraction of 10 Gb/s. Against xs's best
# small-file setting: larger read batches, every core scanning, larger frames, the three
# together, and zstd level 1, both ways.
id = "G3-10g-small-push"
kind = "screening"
hypothesis = "Batching, scanning or framing settings let small and mixed trees use more of the 10GbE link."
primary = "durable_s"
delta = 0.03
blocks = 8
control = "xs-best"
verify = "first-last"
cleanup = "eager"

[arms.xs-best]
tool = "xs"
rev = "453704a64528-tune"
metrics = true
flags = ["-a", "--no-atomic"]
tune = { receiver = "jobs=4" }

[arms.batch256]
tool = "xs"
rev = "453704a64528-tune"
metrics = true
flags = ["-a", "--no-atomic"]
tune = { receiver = "jobs=4", sender = "read_batch_files=256,read_batch_bytes=33554432" }

[arms.scan-all]
tool = "xs"
rev = "453704a64528-tune"
metrics = true
flags = ["-a", "--no-atomic"]
tune = { receiver = "jobs=4", sender = "scan_workers=10" }

[arms.coalesce1m]
tool = "xs"
rev = "453704a64528-tune"
metrics = true
flags = ["-a", "--no-atomic"]
tune = { receiver = "jobs=4", sender = "coalesce_under=65536,coalesce_to=1048576" }

[arms.all-three]
tool = "xs"
rev = "453704a64528-tune"
metrics = true
flags = ["-a", "--no-atomic"]
tune = { receiver = "jobs=4", sender = "read_batch_files=256,read_batch_bytes=33554432,scan_workers=10,coalesce_under=65536,coalesce_to=1048576" }

[arms.z1-best]
tool = "xs"
rev = "453704a64528-tune"
metrics = true
flags = ["-az", "--no-atomic", "--compress-level=1"]
tune = { receiver = "jobs=4" }

[matrix]
link = "mac-freya-10g"
corpus = ["small-flat", "small-deep", "real-congress", "mixed-bimodal"]
scenario = ["fresh"]
direction = ["mac>freya", "freya>mac"]
client = ["initiator"]
cache = ["warm"]
