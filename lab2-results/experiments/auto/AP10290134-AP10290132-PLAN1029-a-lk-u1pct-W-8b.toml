# Written by the 6-hourly planner (2026-10-29T01:34Z). Why: -W is queued for laikav2 fresh but has never been tested on an update, where whole-file could trade delta CPU for a few changed bytes.
id = "AP10290134-AP10290132-PLAN1029-a-lk-u1pct-W-8b"
kind = "screening"
hypothesis = "Because 1% churn changes few bytes, bypassing delta for changed files may cut per-file CPU; xs-rs-W will be at least 3% faster than default and stay below 0.95 of xs-c++, while a loss would rule -W out for updates."
primary = "durable_s"
delta = 0.05
blocks = 8
control = "rsync"
verify = "first-last"
cleanup = "eager"
sample_timeout_s = 7200

[arms.xs-rs]
tool = "xs"
rev = "beabaee992b6-rs"
flags = ["-a", "-j4"]

[arms.xs-rs-W]
tool = "xs"
rev = "beabaee992b6-rs"
flags = ["-a", "-j4", "-W"]

[arms.xs-cpp]
tool = "xs"
rev = "e104bde552f2"
flags = ["-a", "-j4"]

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[matrix]
link = "a-aws"
corpus = ["laikav2-sample"]
scenario = ["update-1pct"]
direction = ["a>aws"]
client = ["initiator"]
cache = ["warm"]
