# Written by the 6-hourly planner (2026-11-01T08:55Z). Why: It tests the same untried interaction on the opposite corpus shape, so any default decision rests on more than one tree.
id = "AP11010855-A1101-cg-u10pct-Wz-8b"
kind = "screening"
hypothesis = "On 25k mostly tiny files the wire is not the cost, so -W -z should not separate from plain -j4 by more than noise (within 3%). If it is faster, compression of whole changed files is cheaper than delta on small files and could become an update default; if it is slower, -z is being paid for on kilobyte listings and should stay off by default."
primary = "durable_s"
delta = 0.03
blocks = 8
control = "rsync"
verify = "first-last"
cleanup = "eager"
sample_timeout_s = 7200

[arms.xs-rs]
tool = "xs"
rev = "beabaee992b6-rs"
flags = ["-a", "-j4"]

[arms.xs-rs-Wz]
tool = "xs"
rev = "beabaee992b6-rs"
flags = ["-a", "-j4", "-W", "-z"]

[arms.xs-cpp]
tool = "xs"
rev = "e104bde552f2"
flags = ["-a", "-j4"]

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[matrix]
link = "a-aws"
corpus = ["congress-sample"]
scenario = ["update-10pct"]
direction = ["a>aws"]
client = ["initiator"]
cache = ["warm"]
