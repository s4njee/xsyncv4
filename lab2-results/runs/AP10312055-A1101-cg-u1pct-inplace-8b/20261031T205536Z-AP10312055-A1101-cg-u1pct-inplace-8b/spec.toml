# Written by the 6-hourly planner (2026-10-31T20:55Z). Why: Congress update-1pct is verdict-grade for xs-rs but has no in-place screen, while its queued no-atomic screen only tests the other write path.
id = "AP10312055-A1101-cg-u1pct-inplace-8b"
kind = "screening"
hypothesis = "Per-file costs dominate this 25k-file corpus; avoiding temp-file creation and rename for changed files should make xs-rs-inplace at least 3% faster than default xs-rs and keep the direct ratio below 0.85. If it does not separate, --inplace is not useful for small-file updates."
primary = "durable_s"
delta = 0.05
blocks = 8
control = "rsync"
verify = "first-last"
cleanup = "eager"
sample_timeout_s = 7200

[arms.xs-rs]
tool = "xs"
rev = "beabaee992b6-rs"
flags = ["-a", "-j4"]

[arms.xs-rs-inplace]
tool = "xs"
rev = "beabaee992b6-rs"
flags = ["-a", "-j4", "--inplace"]

[arms.xs-cpp]
tool = "xs"
rev = "e104bde552f2"
flags = ["-a", "-j4"]

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[matrix]
link = "a-aws"
corpus = ["congress-sample"]
scenario = ["update-1pct"]
