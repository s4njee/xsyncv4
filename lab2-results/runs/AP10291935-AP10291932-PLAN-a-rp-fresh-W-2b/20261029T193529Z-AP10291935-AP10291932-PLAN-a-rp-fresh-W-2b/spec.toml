# Written by the 6-hourly planner (2026-10-29T19:35Z). Why: Real-projects fresh is the only scored transfer cell xs-c++ wins (rs_vs_cpp 1.461), and --whole-file has not been screened there; a 2-block four-arm race is the smallest way to see whether the untried first-copy path changes that decision.
id = "AP10291935-AP10291932-PLAN-a-rp-fresh-W-2b"
kind = "screening"
hypothesis = "A fresh destination has no useful delta base, so --whole-file should remove per-file delta work; xs-rs-W will be at least 5% faster than plain xs-rs and its ratio to xs-c++ will fall from the current 1.46 toward 1.05. If the two xs-rs arms stay within noise, the real-projects gap is not first-copy delta overhead."
primary = "durable_s"
delta = 0.05
blocks = 2
control = "rsync"
verify = "first-last"
cleanup = "eager"
sample_timeout_s = 7200

[arms.xs-rs]
tool = "xs"
rev = "beabaee992b6-rs"
