# Written by the 6-hourly planner (2026-10-28T18:55Z). Why: Explicit -z was the only arm to clear the 5% margin on congress fresh (0.849 vs 0.938 for plain xs-rs), and none of the queued congress update runs (j2, j8, --inplace) tests it.
id = "AP10281855-PLAN1028-a-cg-u10pct-z-8b"
kind = "screening"
hypothesis = "At 10% churn -z has both the changed bytes and the updated listings to compress, so xs-rs-z will finish at least 5% faster than plain xs-rs and move the ~0.88 ratio to xs-c++ toward 0.80; if the two xs-rs arms stay within noise, -z stays a fresh-only setting and not an update default."
primary = "durable_s"
delta = 0.05
blocks = 8
control = "rsync"
verify = "first-last"
cleanup = "eager"
sample_timeout_s = 7200

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[arms.xs-rs]
tool = "xs"
rev = "beabaee992b6-rs"
flags = ["-a", "-j4"]

[arms.xs-rs-z]
tool = "xs"
rev = "beabaee992b6-rs"
flags = ["-a", "-j4", "-z"]

[arms.xs-cpp]
tool = "xs"
rev = "e104bde552f2"
flags = ["-a", "-j4"]

[matrix]
link = "a-aws"
corpus = ["congress-sample"]
scenario = ["update-10pct"]
direction = ["a>aws"]
client = ["initiator"]
cache = ["warm"]
