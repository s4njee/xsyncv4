# Written by the 6-hourly planner (2026-11-01T02:55Z). Why: The write path has never been raced on the small-file fresh cell where xs-rs's engine advantage first showed, and it is the cheapest cell where a new default could be earned.
id = "AP11010255-a1101-cg-fresh-inplace-8b"
kind = "screening"
hypothesis = "Default xs-rs already beats xs-c++ here (0.876 of rsync at 8 blocks); with 25,246 destination files, replacing create+rename per file should save enough syscalls that xs-rs-inplace is at least 3% faster than default xs-rs and its ratio to xs-c++ stays at or below 0.86. If the two xs-rs arms merge, per-file cost lives in scan/transfer rather than the write path, and --inplace is not a fresh-copy default."
primary = "durable_s"
delta = 0.05
blocks = 8
control = "rsync"
verify = "first-last"
cleanup = "eager"
sample_timeout_s = 7200

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[arms.xs-cpp]
tool = "xs"
rev = "e104bde552f2"
flags = ["-a", "-j4"]

[arms.xs-rs]
tool = "xs"
rev = "beabaee992b6-rs"
flags = ["-a", "-j4"]

[arms.xs-rs-inplace]
tool = "xs"
rev = "beabaee992b6-rs"
flags = ["-a", "-j4", "--inplace"]

[matrix]
link = "a-aws"
corpus = ["congress-sample"]
scenario = ["fresh"]
direction = ["a>aws"]
client = ["initiator"]
cache = ["warm"]
