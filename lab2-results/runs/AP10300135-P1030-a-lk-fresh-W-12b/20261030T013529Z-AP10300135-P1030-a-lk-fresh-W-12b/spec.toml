# Written by the 6-hourly planner (2026-10-30T01:35Z). Why: The 29 Oct 12-block laikav2 fresh screen is the only setting that beat default xs-rs (0.841 vs 0.902 of rsync), but no run has compared -W directly with xs-c++ or ruled out noise; the queued laikav2 tree tests -j2 with -W, not -W alone at -j4.
id = "AP10300135-P1030-a-lk-fresh-W-12b"
kind = "screening"
hypothesis = "If whole-file handling is the lever the latest screen hinted at, -W cuts xs-rs's durable time by at least 3% versus default -j4 and pulls its direct ratio to xs-c++ from about 0.95 to below 0.90; if the 12-block intervals overlap, the 0.841 point was noise and -W should not become a fresh-copy default."
primary = "durable_s"
delta = 0.05
blocks = 12
control = "rsync"
verify = "first-last"
cleanup = "eager"
sample_timeout_s = 7200

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[arms.xs-rs]
tool = "xs"
rev = "beabaee992b6-rs"
flags = ["-a", "-j4"]

[arms.xs-cpp]
tool = "xs"
rev = "e104bde552f2"
flags = ["-a", "-j4"]

[arms.xs-rs-W]
tool = "xs"
rev = "beabaee992b6-rs"
flags = ["-a", "-j4", "-W"]

[matrix]
link = "a-aws"
corpus = ["laikav2-sample"]
scenario = ["fresh"]
direction = ["a>aws"]
client = ["initiator"]
cache = ["warm"]
