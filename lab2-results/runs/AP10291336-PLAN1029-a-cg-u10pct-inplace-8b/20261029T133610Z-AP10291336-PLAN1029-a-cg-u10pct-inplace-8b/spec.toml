# Written by the 6-hourly planner (2026-10-29T13:36Z). Why: Queued in-place screens cover laikav2 update-10pct and congress update-1pct, but not the per-file-bound congress update-10pct, where temp-file overhead could matter most.
id = "AP10291336-PLAN1029-a-cg-u10pct-inplace-8b"
kind = "screening"
hypothesis = "At 10% churn on many small files, the temp-file-and-rename path may dominate; if xs-rs-inplace lands below default xs-rs and below 0.85 of xs-cpp with an interval excluding 1, in-place becomes an update default candidate; if it merges with default, the write path is not the bottleneck."
primary = "durable_s"
delta = 0.05
blocks = 8
control = "rsync"
verify = "first-last"
cleanup = "eager"
sample_timeout_s = 7200

[arms.xs-rs]
tool = "xs"
rev = "beabaee992b6-rs"
flags = ["-a", "-j4"]

[arms.xs-rs-inplace]
tool = "xs"
rev = "beabaee992b6-rs"
flags = ["-a", "-j4", "--inplace"]

[arms.xs-cpp]
tool = "xs"
rev = "e104bde552f2"
flags = ["-a", "-j4"]

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[matrix]
link = "a-aws"
corpus = ["congress-sample"]
scenario = ["update-10pct"]
direction = ["a>aws"]
client = ["initiator"]
cache = ["warm"]
