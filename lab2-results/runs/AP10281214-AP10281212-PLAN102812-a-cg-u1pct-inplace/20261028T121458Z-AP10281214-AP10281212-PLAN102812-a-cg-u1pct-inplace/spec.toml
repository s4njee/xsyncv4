[arms.xs-cpp]
tool = "xs"
rev = "e104bde552f2"
flags = ["-a", "-j4"]

[arms.rsync]
tool = "rsync"
flags = ["-a"]

[matrix]
link = "a-aws"
corpus = ["congress-sample"]
scenario = ["update-1pct"]
direction = ["a>aws"]
client = ["initiator"]
cache = ["warm"]
