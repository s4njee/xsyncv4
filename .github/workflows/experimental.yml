name: Experimental

# Pull requests into experimental, where the lab's engineering cases land once their gate accepts them
# (benchmarks/lab/engineer.py). Every PR is built and tested on Linux and macOS, with xs-rs's checks
# when rs/ exists. A PR from an engineer/ branch of this repository, opened by the repository's owner
# (the lab's controllers push with the owner's token), is then approved and merged automatically.
#
# Every push to experimental builds xs's static Linux release (tools/release.Dockerfile) natively on amd64 and
# arm64 and attaches both to the rolling pre-release xs-cpp-builds, as xs-cpp-<commit12>-linux-<arch> with a .sha256
# and its --version line (.version) beside each. The VPS lab races each new xs-rs against the newest of these
# (benchmarks/lab/stage.py and contest.py) instead of building xs itself.

on:
  pull_request:
    branches: [experimental]
  push:
    branches: [experimental]
  # The merge job dispatches this for the commit it merged: GitHub starts no push workflow for a commit
  # pushed with the workflow's own token, so a merged step would otherwise get no binaries.
  workflow_dispatch:
    inputs:
      commit:
        description: the commit to build (the branch's tip if empty)
        required: false

permissions:
  contents: read

concurrency:
  group: experimental-${{ github.event.pull_request.number || inputs.commit || github.sha }}
  cancel-in-progress: true

jobs:
  linux:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ninja-build libzstd-dev libxxhash-dev libicu-dev rsync
      - name: Build this change and its base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DXSYNC_GIT_HASH=${GITHUB_SHA::12}"
          cmake --build build --target xsync -j4
          git worktree add --detach base "$BASE"
          cmake -S base -B base/build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DXSYNC_GIT_HASH=${BASE::12}"
          cmake --build base/build --target xsync -j4
      # The rule of the lab's gate (benchmarks/lab/engineer.py): no test that passes on the base may fail
      # with the change, and a test the change adds must pass. A test that already fails on the base (such
      # as one this runner's environment cannot support) does not count against the change.
      - name: Tests (no test that passes on the base may fail)
        env:
          XSYNC_FALLBACK: '0'
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, subprocess, sys
          cpp = ['filter_test', 'xattr_value_test', 'sparse_test', 'scan_admission_test']
          py = ['destination_scope_test.py', 'delta_test.py', 'deletion_test.py', 'directory_lifetime_test.py', 'p0_test.py',
                'wire_test.py', 'error_test.py', 'output_test.py', 'broken_stdout_test.py', 'list_test.py',
                'filter_merge_test.py', 'prune_wire_test.py', 'defaults_test.py', 'dry_summary_test.py']
          def run(tree, test):
              tree = pathlib.Path(tree).resolve()
              if test in cpp:
                  built = subprocess.run(['cmake', '--build', tree / 'build', '--target', test, '-j4'])
                  return built.returncode == 0 and subprocess.run([tree / 'build' / test], cwd=tree).returncode == 0
              if not (tree / 'tests' / test).exists():
                  return None
              env = {**os.environ, 'XSYNC_TEST_BINARY': str(tree / 'build' / 'xs'), 'XSYNC_TEST_RSYNC': shutil.which('rsync')}
              return subprocess.run([sys.executable, f'tests/{test}'], cwd=tree, env=env).returncode == 0
          regressions = []
          for test in cpp + py:
              print(f'::group::{test}', flush=True)
              here = run('.', test)
              base = run('base', test) if here is False else None
              print('::endgroup::', flush=True)
              print(f'{test}: {"pass" if here else "skipped" if here is None else "fail" + (" (fails on the base too)" if base is False else "")}', flush=True)
              if here is False and base is not False:
                  regressions.append(test)
          if regressions:
              sys.exit(f'tests that pass on the base fail with this change: {", ".join(regressions)}')
          PY
      - name: xs-rs (tests against this build, clippy, rustfmt)
        if: hashFiles('rs/Cargo.toml') != ''
        run: |
          rustup component add clippy rustfmt
          XS_BIN="$PWD/build/xs" cargo test --manifest-path rs/Cargo.toml
          cargo clippy --manifest-path rs/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path rs/Cargo.toml --check

  macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          brew install ninja zstd xxhash icu4c
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DICU_ROOT=$(brew --prefix icu4c)" "-DXSYNC_GIT_HASH=${GITHUB_SHA::12}"
          cmake --build build --target xsync -j3
      - name: C++ unit tests
        run: |
          for test in filter_test xattr_value_test; do
            cmake --build build --target "$test" -j3 && "build/$test"
          done
      - name: A local copy
        run: |
          mkdir -p "$RUNNER_TEMP/source/deep" && printf 'experimental\n' > "$RUNNER_TEMP/source/deep/file"
          build/xs --no-fallback -a "$RUNNER_TEMP/source/" "$RUNNER_TEMP/copy/"
          cmp "$RUNNER_TEMP/source/deep/file" "$RUNNER_TEMP/copy/deep/file"

  merge:
    needs: [linux, macos]
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.head.ref, 'engineer/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Approve and merge the engineer's change
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --approve \
            --body "The lab's gate accepted this change, and it builds and passes the tests on Linux and macOS."
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          merged=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq .mergeCommit.oid)
          gh workflow run experimental.yml --repo "$GITHUB_REPOSITORY" --ref experimental -f commit="$merged"

  binaries:
    if: github.event_name != 'pull_request'
    name: binary (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - name: Build the static release (tools/release.Dockerfile, as the lab builds it)
        env:
          COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          short="${COMMIT::12}"
          docker build --build-arg "XSYNC_GIT_HASH=$short" -t xs-release -f tools/release.Dockerfile .
          name="xs-cpp-$short-linux-${{ matrix.arch }}"
          container=$(docker create xs-release /xs)
          docker cp "$container:/xs" "$name"
          docker rm "$container"
          chmod 755 "$name"
          "./$name" --version | head -n 1 > "$name.version"
          cat "$name.version"
          sha256sum "$name" > "$name.sha256"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - name: Attach it to xs-cpp-builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Both architectures' jobs may find the release missing at once: the second create fails and finds it.
          gh release view xs-cpp-builds --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create xs-cpp-builds --repo "$GITHUB_REPOSITORY" --prerelease --target experimental \
              --title "xs-c++ builds" --notes "Static Linux releases of xs for each commit of experimental, built by the Experimental workflow." ||
            gh release view xs-cpp-builds --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload xs-cpp-builds "$NAME" "$NAME.sha256" "$NAME.version" --repo "$GITHUB_REPOSITORY" --clobber

  prune:
    needs: [binaries]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Keep the newest 40 builds (six files each)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/xs-cpp-builds" --jq '.assets | sort_by(.created_at) | reverse | .[240:] | .[].id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"; done
